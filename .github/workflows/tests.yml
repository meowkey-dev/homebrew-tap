name: tests

# Install and smoke-test the formula as users get it — tapped from GitHub, not
# from the checkout — so what is tested is exactly what is published.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: Tap
        run: brew tap meowkey-dev/tap

      - name: Install
        run: brew install meowkey-dev/tap/analog

      - name: Test
        run: brew test meowkey-dev/tap/analog
