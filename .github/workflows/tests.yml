name: tests

# Install and smoke-test the formula whenever it changes, on macOS and Linux.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: Homebrew/actions/setup-homebrew@master

      - name: Tap this checkout
        run: brew tap meowkey-dev/tap "$PWD"

      - name: Install
        run: brew install meowkey-dev/tap/analog

      - name: Test
        run: brew test meowkey-dev/tap/analog
